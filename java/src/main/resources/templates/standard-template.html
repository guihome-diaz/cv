<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title th:text="|CV ${cv.firstName} ${cv.lastName}|">CV</title>
    <link rel="stylesheet" href="../static/css/standard-template.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>

<!-- ============ HEADER ============ -->
<header class="cv-header">
    <h1 class="header-name" th:text="|${cv.firstName} ${cv.lastName}|">John DOE</h1>
    <div class="header-contact">
        <span th:text="${cv.address.city + ', ' + cv.address.country}">City, Country</span>
        <span th:if="${cv.phone}"> | <span th:text="${cv.phone}">Phone</span></span>
        <span th:if="${cv.email}"> | <span th:text="${cv.email}">Email</span></span>
        <span th:if="${hasLinkedIn}"> | LinkedIn</span>
    </div>
    <div class="header-meta" style="margin-top: 4px; font-size: 9.5pt; color: #555;">
        <span th:text="|Poste visé : ${cv.jobTitle}|">Poste visé</span>
        <span th:if="${cv.nationality}"> | Nationalité : <span th:text="${cv.nationality}">Nationalité</span></span>
    </div>
</header>

<!-- ============ MAIN CONTENT ============ -->
<main>

    <!-- PROFIL -->
    <section class="cv-section" th:if="${cv.birthDate}">
        <h2 class="cv-section-title">Profil</h2>
        <p th:text="|Professionnelle expérimentée en ${cv.jobTitle} avec solide expérience internationale.|">
            Profil...
        </p>
    </section>

    <!-- EXPERIENCE -->
    <section class="cv-section">
        <h2 class="cv-section-title">Professional experience</h2>

        <!-- Inversed order: from latest (current) to oldest -->
        <th:block th:each="exp, iterStat : ${cv.experiences}"
                  th:unless="${iterStat.index >= 0 and T(java.util.Comparator).nullsLast(T(java.util.Comparator).comparing(T(java.util.function.Function).identity())).reversed()}">
        </th:block>

        <article th:each="exp : ${cv.experiences}"
                 th:with="endDate=${exp.dates?.end != null} ? |${#numbers.formatInteger(exp.dates.end.month, 2)}/${exp.dates.end.year}| : 'CURRENT',
                              startDate=${exp.dates?.start != null} ? |${#numbers.formatInteger(exp.dates.start.month, 2)}/${exp.dates.start.year}| : '',
                              dateRange=|${startDate} — ${endDate}|"
                 class="experience-item">

            <div class="experience-main">
                <div class="job-info">
                    <span class="job-title" th:text="${exp.jobTitle}">Job title</span>
                    <span class="job-company" th:if="${exp.company?.name}" th:text="| — ${exp.company.name}|"> Company name</span>
                </div>
                <span class="job-dates" th:text="${dateRange}">Dates</span>
            </div>

            <div class="job-subtitle" th:if="${exp.jobSubTitle}" th:text="${exp.jobSubTitle}">Job sub-title</div>

            <div class="job-location" th:if="${exp.location != null}"
                 th:text="|${exp.location.city}, ${exp.location.country}|">Location</div>

            <!-- TÂCHES: parsing hiérarchique via Thymeleaf -->
            <ul class="tasks" th:if="${exp.tasks}" th:utext="${@taskProcessor.processToHtml(exp.tasks)}">
                <!-- Le processeur génère les <li> et sous-listes -->
            </ul>
        </article>
    </section>

    <!-- FORMATION -->
    <section class="cv-section">
        <h2 class="cv-section-title">Formation</h2>

        <div th:each="edu : ${cv.education}" class="education-item">
            <div class="education-content">
                <span class="edu-degree" th:text="${edu.diploma.degree}">Diplôme</span>
                <span class="edu-eqf" th:if="${edu.diploma.europeanLevel != null}"
                      th:text="| (EQF ${edu.diploma.europeanLevel})|"> (EQF)</span>
                <span class="edu-field" th:text="| — ${edu.diploma.name}|"> — Nom</span>
                <div class="edu-school" th:text="|${edu.school.name}, ${edu.school.location.city}|">École</div>
            </div>
            <span class="edu-year" th:text="${edu.year}">Année</span>
        </div>
    </section>

    <!-- LANGUES -->
    <section class="cv-section">
        <h2 class="cv-section-title">Langues</h2>

        <table class="lang-table">
            <tr th:each="lang : ${cv.languages}">
                <td th:text="${lang.language}">Langue</td>
                <td th:text="${lang.motherTongue} ? 'Langue maternelle' : |Niveau ${lang.level}|">Niveau</td>
                <td th:text="${lang.description}">Description</td>
            </tr>
        </table>
    </section>

</main>

</body>
</html>
